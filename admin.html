<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/Bhahaus%20Logo/SSingle%20logo.png" />
    <link rel="apple-touch-icon" href="/Bhahaus%20Logo/SSingle%20logo.png" />
    <title>Admin — BHAHAUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <!-- Login gate -->
    <div class="login-screen" id="login-screen">
      <div class="login-card">
        <a class="login-brand" href="/">
          <img class="login-logo" src="/Bhahaus%20Logo/Bhahaus_Architect%2001Logo-header.png?v=1" alt="Bhahaus" width="145" height="39" />
          <span class="login-tagline">A DESIGN COLLECTIVE</span>
        </a>
        <h1>Studio Admin</h1>
        <p>Enter your 6-digit passcode to continue.</p>
        <form id="login-form" autocomplete="off">
          <div class="pin-row" id="pin-row">
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-pin="0" autofocus />
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-pin="1" />
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-pin="2" />
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-pin="3" />
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-pin="4" />
            <input type="password" inputmode="numeric" maxlength="1" class="pin-box" data-pin="5" />
          </div>
          <div class="login-error" id="login-error"></div>
          <button class="login-btn" type="submit">Unlock →</button>
        </form>
      </div>
    </div>

    <!-- Admin panel (hidden until authenticated) -->
    <div class="admin-app" id="admin-app" style="display:none">
      <header class="admin-header">
        <a class="admin-brand" href="/">
          <img class="login-logo" src="/Bhahaus%20Logo/Bhahaus_Architect%2001Logo-header.png?v=1" alt="Bhahaus" width="130" height="36" />
        </a>
        <span class="admin-label">PROJECT ADMINISTRATION</span>
        <button class="admin-logout" id="logout-btn">Lock & Exit ↗</button>
      </header>

      <main class="admin-main">
        <!-- Project form -->
        <section class="admin-form-section" id="form-section">
          <h2 id="form-heading">Add a new project</h2>
          <form class="admin-form" id="project-form">
            <input type="hidden" name="id" id="field-id" value="" />

            <label>Project name
              <input type="text" name="title" id="field-title" required maxlength="120" placeholder="The Courtyard House" />
            </label>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <label>Portfolio Status / Tab
                <select name="status" id="field-status" style="width:100%;border:1px solid #d5d5ce;background:#fbfaf6;padding:11px 13px;font:13px var(--font)">
                  <option value="finished">Selected Work</option>
                  <option value="ongoing">Ongoing Work</option>
                </select>
              </label>

              <label>Category
                <select name="category" id="field-category" style="width:100%;border:1px solid #d5d5ce;background:#fbfaf6;padding:11px 13px;font:13px var(--font)">
                  <option value="Residential">Residential</option>
                  <option value="Interiors">Interiors</option>
                  <option value="Hospitality">Hospitality</option>
                  <option value="Commercial">Commercial</option>
                </select>
              </label>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <label>Year
                <input type="number" name="year" id="field-year" required min="1900" max="2099" placeholder="2025" />
              </label>

              <label>Featured badge
                <input type="text" name="badge" id="field-badge" maxlength="30" placeholder="FEATURED / ON THE BOARDS" />
              </label>
            </div>

            <label>Details / description
              <textarea name="description" id="field-description" maxlength="2000" rows="4" placeholder="Tell us what makes this place special…"></textarea>
            </label>

            <label>Cover photo
              <span class="field-hint">This is the main thumbnail shown on the public projects page.</span>
              <input type="file" name="cover" id="field-cover" accept="image/*" />
            </label>
            <div class="cover-preview" id="cover-preview"></div>

            <label>Additional photos <span class="field-hint">(optional — select multiple)</span>
              <input type="file" name="gallery" id="field-gallery" accept="image/*" multiple />
            </label>
            <div class="gallery-preview" id="gallery-preview"></div>

            <div class="form-actions">
              <button class="btn-primary" type="submit" id="submit-btn">Add project →</button>
              <button class="btn-secondary" type="button" id="cancel-btn" style="display:none">Cancel editing</button>
            </div>
            <div class="form-message" id="form-message"></div>
          </form>
        </section>

        <!-- Project list -->
        <section class="admin-list-section">
          <div class="list-header">
            <h2>All projects</h2>
            <span class="project-count" id="project-count">0 projects</span>
          </div>
          <div class="admin-project-list" id="project-list"></div>
        </section>
      </main>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
